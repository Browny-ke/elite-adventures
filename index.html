<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1020" />
  <meta name="description" content="Elite Adventures — Adventure Beyond Limits. Discover trips, book adventures, connect with travellers and explore Kenya." />
  <title>Elite Adventures® | Adventure Beyond Limits</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: #0c1020;
      color: #ffffff;
      font-family: "DM Sans", sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    .startup-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(7, 12, 28, .05), rgba(7, 12, 28, .75)),
        linear-gradient(135deg, #108bce, #6535a5 45%, #f12d88 75%, #ff9145);
      text-align: center;
      animation: startupFade 1s ease forwards;
      animation-delay: 2.2s;
    }

    .startup-content {
      width: min(100%, 400px);
    }

    .startup-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 142px;
      height: 142px;
      margin: 0 auto 25px;
      overflow: hidden;
      border: 4px solid #ff3c98;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 30px #ff4ba577;
    }

    .startup-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .startup-fallback {
      display: none;
      color: #171d30;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
    }

    .startup-content h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 36px);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .startup-slogan {
      margin: 13px 0 28px;
      font-family: "Playfair Display", serif;
      font-size: 24px;
      font-style: italic;
    }

    .startup-loader {
      width: min(220px, 80%);
      height: 5px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 10px;
      background: #ffffff44;
    }

    .startup-loader span {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff168b, #ffb13b, #ffffff);
      animation: loadingMove 1.4s ease-in-out infinite alternate;
    }

    .startup-content small {
      display: block;
      margin-top: 15px;
      color: #ffffffd9;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @keyframes loadingMove {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(120%);
      }
    }

    @keyframes startupFade {
      to {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="startup-screen" id="startupScreen">
      <div class="startup-content">
        <div class="startup-logo">
          <img
            src="./assets/elite-adventures-logo.png"
            alt="Elite Adventures logo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <span class="startup-fallback">ELITE<br />ADVENTURES</span>
        </div>

        <h1>ELITE ADVENTURES®</h1>
        <p class="startup-slogan">Adventure Beyond Limits</p>

        <div class="startup-loader">
          <span></span>
        </div>

        <small>YOUR NEXT ADVENTURE STARTS HERE</small>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      window.setTimeout(function () {
        var splash = document.getElementById("startupScreen");
        if (splash) splash.remove();
      }, 2600);
    });
  </script>

  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
